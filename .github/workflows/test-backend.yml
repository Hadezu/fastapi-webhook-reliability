name: Test Backend

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: backend_coverage_proof
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d backend_coverage_proof"
          --health-interval 2s --health-timeout 3s --health-retries 30
      mailpit:
        image: axllent/mailpit:v1.31.4
        ports: ['1025:1025', '8025:8025']
    env:
      DATABASE_URL: postgresql+psycopg://postgres:disposable-ci-only@127.0.0.1:5432/backend_coverage_proof
      PROJECT_NAME: Backend coverage CI
      SECRET_KEY: isolated-ci-jwt-key-not-for-deployment-0001
      FIRST_SUPERUSER: operator@example.com
      FIRST_SUPERUSER_PASSWORD: isolated-ci-password-0001
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      SMTP_TLS: 'false'
      EMAILS_FROM_EMAIL: noreply@example.com
      WEBHOOK_ENABLED: '0'
      WEBHOOK_OWNER_ID: 11111111-1111-4111-8111-111111111111
      WEBHOOK_INBOUND_SECRET: isolated-ci-inbound-key-not-for-deployment-0001
      WEBHOOK_OUTBOUND_SECRET: isolated-ci-outbound-key-not-for-deployment-0001
      PROOF_TEST_ALLOW_RESET: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.23'
      - run: uv sync --locked --package app --group dev
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.12'
      - name: Build the frontend required by the non-development application
        run: bun install --frozen-lockfile && bun run --filter frontend build
      - name: Migrate DB
        run: uv run bash scripts/prestart.sh
        working-directory: backend
      - name: Full upstream backend tests (extension disabled)
        run: uv run bash scripts/tests-start.sh "Coverage for ${{ github.sha }}"
        working-directory: backend
      - name: Extension fault tests (same coverage source, fresh application process)
        env:
          WEBHOOK_ENABLED: '1'
        run: |
          uv run coverage run --append -m pytest ../proof_tests -q --junitxml=../proof-coverage.xml
          uv run coverage html --title "Backend and webhook coverage"
          uv run coverage xml
        working-directory: backend
      - name: Store coverage files
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-html
          path: |
            backend/htmlcov
            backend/coverage.xml
            proof-coverage.xml
          include-hidden-files: true
      - name: Coverage report
        run: uv run coverage report --fail-under=90
        working-directory: backend
