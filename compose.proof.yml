name: webhook-reliability-proof
x-app: &app
  build:
    context: .
    dockerfile: proof/Dockerfile
  env_file: .env.proof
  environment: &environment
    DATABASE_URL: postgresql+psycopg://proof:${PROOF_DB_PASSWORD:?Run proof/configure.py}@db:5432/webhook_proof
    WEBHOOK_DESTINATION_URL: http://receiver:8091/catalog
    SMTP_HOST: ""
  init: true
  restart: "no"
services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: proof
      POSTGRES_PASSWORD: ${PROOF_DB_PASSWORD:?Run proof/configure.py}
      POSTGRES_DB: webhook_proof
    volumes: [proof-db:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U proof -d webhook_proof"]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    <<: *app
    command: [sh, -c, "alembic upgrade head && python -m proof_seed && python -c 'from proof_receiver import initialize; initialize()'"]
    depends_on:
      db: {condition: service_healthy}
  api:
    <<: *app
    ports: ["127.0.0.1:8090:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
  worker:
    <<: *app
    command: [python, -m, app.webhooks.worker]
    depends_on:
      migrate: {condition: service_completed_successfully}
      receiver: {condition: service_started}
  receiver:
    <<: *app
    command: [uvicorn, "proof_receiver:app", --host, "0.0.0.0", --port, "8091"]
    depends_on:
      migrate: {condition: service_completed_successfully}
volumes:
  proof-db:
